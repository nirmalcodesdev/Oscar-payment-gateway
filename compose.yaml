name: oscar-payment-gateway

x-application: &application
  build:
    context: .
    target: runtime
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &application-environment
    NODE_ENV: development
    LOG_LEVEL: info
    SERVICE_NAME: oscar-payment-gateway
    API_HOST: 0.0.0.0
    API_PORT: 3000
    SHUTDOWN_TIMEOUT_MS: 10000
    MONGODB_URI: mongodb://oscar_app:local-app-password@mongodb:27017/oscar_payment_gateway?authSource=admin&replicaSet=rs0
    MONGODB_REPLICA_SET: rs0
    MONGODB_CONNECT_TIMEOUT_MS: 10000
    REDIS_URL: redis://redis:6379
    REDIS_CONNECT_TIMEOUT_MS: 10000
    QUEUE_PREFIX: oscar
    ADMIN_JWT_CURRENT_KEY_ID: local-v1
    ADMIN_JWT_CURRENT_SECRET: local-admin-jwt-secret-change-me-please-32
    ADMIN_JWT_PREVIOUS_KEY_ID: ""
    ADMIN_JWT_PREVIOUS_SECRET: ""
    MERCHANT_STEP_UP_SECRET: local-merchant-step-up-secret-change-me-32
    ADMIN_ACCESS_TTL_SEC: 600
    ADMIN_REFRESH_TTL_SEC: 604800
    MERCHANT_STEP_UP_TTL_SEC: 300
    WALLET_NETWORK_ALLOWLIST: '{"ethereum-mainnet":"mainnet","ethereum-sepolia":"testnet"}'
    RPC_PROVIDER_CATALOG: '{"local-rpc-a":{"operatorId":"local-operator-a","url":"http://rpc-mock-a:8545"},"local-rpc-b":{"operatorId":"local-operator-b","url":"http://rpc-mock-b:8545"},"local-rpc-wrong":{"operatorId":"local-operator-c","url":"http://rpc-mock-wrong:8545"},"local-rpc-unreachable":{"operatorId":"local-operator-d","url":"http://rpc-mock-unreachable:8545"}}'
    RPC_REQUEST_TIMEOUT_MS: 5000
    PAYMENT_EXPIRY_MIN_SEC: 300
    PAYMENT_EXPIRY_MAX_SEC: 7200
    PAYMENT_EXPIRY_DEFAULT_SEC: 900
    IDEMPOTENCY_TTL_SEC: 86400
    PAYMENT_CREATE_RATE_LIMIT_PER_MINUTE: 60
    INGESTION_HMAC_CURRENT_KEY_ID: local-v1
    INGESTION_HMAC_CURRENT_SECRET: local-ingestion-hmac-secret-change-me-32
    INGESTION_HMAC_PREVIOUS_KEY_ID: ""
    INGESTION_HMAC_PREVIOUS_SECRET: ""
    INGESTION_TIMESTAMP_SKEW_SEC: 300
    INGESTION_NONCE_TTL_SEC: 600
    INTERNAL_INGESTION_BASE_URL: http://api:3000
    WATCHER_POLL_INTERVAL_MS: 2000
    WATCHER_BATCH_SIZE: 10
    WATCHER_REGISTRY_REFRESH_SEC: 30
    WATCHER_INITIAL_LOOKBACK_BLOCKS: 0
    WEBHOOK_HMAC_CURRENT_KEY_ID: local-v1
    WEBHOOK_HMAC_CURRENT_SECRET: local-webhook-hmac-secret-change-me-32
    WEBHOOK_HMAC_PREVIOUS_KEY_ID: ""
    WEBHOOK_HMAC_PREVIOUS_SECRET: ""
    WEBHOOK_DELIVERY_TIMEOUT_MS: 5000
    WEBHOOK_MAX_ATTEMPTS: 8
    WEBHOOK_RETENTION_SEC: 604800
    SCHEDULER_LEASE_TTL_SEC: 60
    SCHEDULER_EXPIRY_SWEEP_SEC: 30
    SCHEDULER_CONFIRMATION_RECHECK_SEC: 60
    SCHEDULER_STUCK_PAYMENT_SEC: 300
    SCHEDULER_SCREENING_RECHECK_SEC: 300
    SCHEDULER_REGISTRY_REFRESH_SEC: 60
    SCHEDULER_WEBHOOK_SWEEP_SEC: 30
    SCHEDULER_RETENTION_SEC: 3600
    STUCK_PAYMENT_THRESHOLD_SEC: 1800
    SANCTIONS_STATIC_LIST: '{"listVersion":"local-test-v1","addresses":["0xD78523784b3A8e5c21D026eE7Fe405C39D1542ac"]}'
    SCREENING_CACHE_TTL_SEC: 604800
  depends_on:
    mongodb-migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  init: true
  stop_grace_period: 20s

services:
  rpc-mock-a:
    build:
      context: .
      target: runtime
    image: oscar-rpc-mock:local
    command: ["node", "dist/processes/mock-rpc.js"]
    environment:
      RPC_MOCK_CHAIN_ID: 11155111
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8545/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  rpc-mock-b:
    image: oscar-rpc-mock:local
    command: ["node", "dist/processes/mock-rpc.js"]
    environment:
      RPC_MOCK_CHAIN_ID: 11155111
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8545/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  rpc-mock-wrong:
    image: oscar-rpc-mock:local
    command: ["node", "dist/processes/mock-rpc.js"]
    environment:
      RPC_MOCK_CHAIN_ID: 1
    networks:
      - backend
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8545/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    build:
      context: ./docker/mongodb
    image: oscar-mongodb:8.0.13-local
    restart: unless-stopped
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--auth",
        "--keyFile",
        "/run/secrets/mongodb-keyfile",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: local-root-password
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username root --password local-root-password --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend

  mongodb-init:
    image: mongo:8.0.13
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USERNAME: root
      MONGO_ROOT_PASSWORD: local-root-password
      MONGO_APP_USERNAME: oscar_app
      MONGO_APP_PASSWORD: local-app-password
      MONGO_MIGRATION_USERNAME: oscar_migrate
      MONGO_MIGRATION_PASSWORD: local-migration-password
      MONGO_REPLICA_SET: rs0
    volumes:
      - ./docker/mongodb/init-replica-set.js:/opt/oscar/init-replica-set.js:ro
    entrypoint:
      [
        "mongosh",
        "mongodb://mongodb:27017/admin",
        "--quiet",
        "--file",
        "/opt/oscar/init-replica-set.js",
      ]
    networks:
      - backend

  mongodb-migrate:
    build:
      context: .
      target: runtime
    restart: "no"
    command: ["node", "dist/processes/migrate.js"]
    environment:
      <<: *application-environment
      MONGODB_URI: mongodb://oscar_migrate:local-migration-password@mongodb:27017/oscar_payment_gateway?authSource=admin&replicaSet=rs0
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    init: true

  redis:
    image: redis:8.2.1-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    <<: *application
    command: ["node", "dist/processes/api.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api-host:
    build:
      context: ./docker/tcp-proxy
    image: oscar-tcp-proxy:node24-local
    restart: unless-stopped
    environment:
      LISTEN_PORT: 3000
      TARGET_HOST: api
      TARGET_PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend
      - host-access
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('node:net').connect(+process.env.TARGET_PORT,process.env.TARGET_HOST,()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb-host:
    image: oscar-tcp-proxy:node24-local
    restart: unless-stopped
    environment:
      LISTEN_PORT: 27017
      TARGET_HOST: mongodb
      TARGET_PORT: 27017
    depends_on:
      mongodb-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - backend
      - host-access
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('node:net').connect(+process.env.TARGET_PORT,process.env.TARGET_HOST,()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  watcher:
    <<: *application
    command: ["node", "dist/processes/watcher.js"]
    depends_on:
      mongodb-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  processor:
    <<: *application
    command: ["node", "dist/processes/processor.js"]
    depends_on:
      mongodb-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  scheduler:
    <<: *application
    command: ["node", "dist/processes/scheduler.js"]

networks:
  backend:
    internal: true
  host-access:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
